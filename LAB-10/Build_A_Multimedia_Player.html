<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Player Page</title>
</head>
<body>
  <main>
    <h1>Media Player</h1>

    <section>
      <h2>Sailing Away</h2>
      <audio controls aria-label="Sailing Away audio track">
        <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">
      </audio>
    </section>

    <section>
      <h2>What is the map method and how does it work?</h2>
      <video controls width="600" aria-label="Educational video explaining the JavaScript map method">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
        <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="subtitles" srclang="en" label="English">
      </video>
    </section>

    <section>
      <h2>Transcript</h2>
      <p>This video explains how the JavaScript array method map works by walking through interactive examples.</p>
    </section>
  </main>
</body>
</html>
