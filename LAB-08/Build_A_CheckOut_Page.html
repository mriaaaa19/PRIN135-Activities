<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
<h1> Checkout </h1>
<section>
    <h2> Your Cart </h2>
    <h3> Dior Addict Lip Glow </h3>
    <img src="https://www.sephora.com/productimages/sku/s2962496-main-zoom.jpg?imwidth=175" alt="rubiks cube">
</section>

<section>
    <h2> Payment Information </h2>
    <form>
        <label for="card-name" > Card Name 
            <span aria-hidden="true"> * </span>
        </label>
        <input required type="text" id="card-name" name="card-name">

        <label for="card-number" > Card Number 
            <span aria-hidden="true"> * </span>
        </label>
        <input required type="text" id="card-number" name="card-number" aria-describedby="card-number-help">
        <p id="card-number-help"> Please enter your 16-digit card number without spaces or dashes. </p>

        <label for="expiry-date" > Expiry Date
            <span aria-hidden="true"> * </span>
        </label>
        <input required type="text" id="expiry-date" name="expiry-date">

        <label for="cvv" > CVV 
            <span aria-hidden="true"> * </span>
        </label>
        <input required type="text" id="cvv" name="cvv">

        <button type="button" id="checkout" name="checkout"> Confirm Order </button>
       
    </form>
</section>
</body>

</html>
